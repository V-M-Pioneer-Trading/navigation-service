# application.properties

# ── SQLite datasource ──────────────────────────────────────────────────────────
# Set SQLITE_DB_PATH env var for production; defaults to ./data/navigation.db
spring.datasource.url=jdbc:sqlite:${SQLITE_DB_PATH:./data/navigation.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite doesn't cope well with concurrent writers — keep pool size 1
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000

# Run schema.sql on every startup (uses CREATE TABLE IF NOT EXISTS so it is idempotent)
spring.sql.init.mode=always

# ── SpaceTraders upstream ──────────────────────────────────────────────────────
# All SpaceTraders calls route through st-gateway's shared rate budget
# (meta#1/meta#7) instead of hitting SpaceTraders directly.
spacetraders.base-url=${ST_GATEWAY_URL:http://localhost:3002}/proxy

# ── Cache lifetimes ────────────────────────────────────────────────────────────
# Waypoints and shipyards are cached until a caller asks for a refresh; market prices
# move with trading activity, so they expire. 0s means "always re-fetch".
navigation.market.cache-ttl=${MARKET_CACHE_TTL:60s}

# ── Who is calling: auth-service introspection ─────────────────────────────────
# This service verifies no token itself. It POSTs the bearer token it received to
# auth-service and acts on the answer (auth-design.md decision 21, RFC 7662). Both
# values are required: the service refuses to start without either, and there is
# no auth-optional mode. CLERK_JWT_KEY / CLERK_ISSUER may still be set by the
# deployment (kept for rollback until meta#80 step 10); nothing reads them.
#
# The FULL endpoint URL, /auth/v1/introspect included, POSTed to verbatim —
# never a base URL. Production: http://localhost:3005/auth/v1/introspect.
auth.introspection.url=${AUTH_INTROSPECTION_URL:}
# Sent as X-Introspection-Secret. Never the vault's AUTH_SERVICE_SHARED_SECRET.
auth.introspection.secret=${AUTH_INTROSPECTION_SECRET:}

# ── CORS ─────────────────────────────────────────────────────────────────────
# Comma-separated list of browser origins allowed to call /api/**.
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# ── Server ─────────────────────────────────────────────────────────────────────
# Environment variables outrank this file, so SERVER_PORT still overrides it.
server.port=${SERVER_PORT:8080}

# ── OpenAPI / Swagger UI ───────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Static resources ───────────────────────────────────────────────────────────
# This service serves no static content, so Spring Boot's catch-all /** resource
# handler is off: an unmatched path is a plain 404 that no handler, and so no
# credential declaration, is involved in. Swagger UI registers its own handler.
spring.web.resources.add-mappings=false
